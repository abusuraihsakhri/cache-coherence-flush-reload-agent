name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate environment
        run: |
          python -m pip check
          python -m compileall -q .
          ruff check .

      - name: Build package
        run: python -m build

      - name: Run tests
        run: python -m pytest -p no:zarr -v

      - name: CLI smoke tests
        run: |
          cache-coherence-analyze --analysis-id CI --timings 45,52,280,295 --threshold 120 --json > /tmp/report.json
          python -m json.tool /tmp/report.json > /dev/null
          python cli.py batch -i sample.csv -o /tmp/out_smoke.csv
          test -s /tmp/out_smoke.csv
