[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cache-coherence-flush-reload-engine"
version = "2.0.0"
description = "Cache-Timing: Prime+Probe & Flush+Reload Contention Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cache-coherence-flush-reload-engine = "cache_timing.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/cache-coherence-flush-reload-engine"
Repository = "https://github.com/abusuraihsakhri/cache-coherence-flush-reload-engine.git"
